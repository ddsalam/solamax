name: Prisma migrate deploy (Cloud SQL Auth Proxy)
description: >
  Menjalankan `prisma migrate deploy` terhadap SATU instance Cloud SQL lewat
  Cloud SQL Auth Proxy resmi (mode unix-socket, sehingga secret DATABASE_URL
  ber-host=/cloudsql/... yang dipakai Cloud Run bekerja verbatim — tanpa
  rewrite URL). Menolak jalan bila DATABASE_URL tidak menunjuk instance yang
  diharapkan (guard salah-target; nilai secret tidak pernah di-echo).
  Prasyarat: job sudah ter-auth via google-github-actions/auth (WIF) dan
  dependensi backend sudah ter-install (pnpm install --filter @solamax/backend...).

inputs:
  instance:
    description: "Connection name instance Cloud SQL (project:region:instance) yang WAJIB menjadi target"
    required: true
  db-secret:
    description: "Nama secret Secret Manager berisi DATABASE_URL role `ingest` untuk tier ini"
    required: true
  coverage:
    description: >
      Mode gerbang cakupan unit: "off" | "report" | "enforce".
      ⚠️ "report" WAJIB dinyalakan di tier TESTING. Versi pertama langkah ini
      hanya berjalan di pilot, sehingga kegagalan PERTAMANYA jatuh di produksi
      (URL psql kehilangan host=/cloudsql, "Connection refused", 15-09-2026).
      Gerbang yang dibangun untuk menangkap "belum teruji di tier sebenarnya"
      ternyata sendiri belum teruji di tier sebenarnya.
      Dalam "report": sambungan dan kueri TETAP dituntut berhasil (itu bagian
      yang gagal di produksi), hanya VONIS cakupannya yang tidak menjatuhkan —
      daftar unit di tier testing sintetis dan tidak mewakili penjadwal.
    required: false
    default: "off"
  forbid:
    description: >
      Substring yang TIDAK BOLEH muncul di DATABASE_URL. Wajib diisi "rlsstg"
      pada tier pilot: connection name pilot (…:solamax-pg) adalah prefix dari
      connection name testing (…:solamax-pg-rlsstg), jadi cek `instance` saja
      tidak cukup membedakannya.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Ambil DATABASE_URL dari Secret Manager (nilai di-mask di log)
      id: db
      uses: google-github-actions/get-secretmanager-secrets@v2
      with:
        secrets: |-
          url:solamax/${{ inputs.db-secret }}

    - name: Jalankan Cloud SQL Auth Proxy (unix socket, binary pinned)
      shell: bash
      env:
        PROXY_VERSION: v2.14.2
        PROXY_SHA256: 2f819e6e47e9026fa467cf55ca88eb674c698f8a93aecf940a364b4432c933f5
        INSTANCE: ${{ inputs.instance }}
      run: |
        curl -fsSL -o /tmp/cloud-sql-proxy \
          "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
        echo "${PROXY_SHA256}  /tmp/cloud-sql-proxy" | sha256sum -c -
        chmod +x /tmp/cloud-sql-proxy
        sudo mkdir -p /cloudsql && sudo chown "$(id -u)" /cloudsql
        /tmp/cloud-sql-proxy --unix-socket /cloudsql "${INSTANCE}" >/tmp/cloud-sql-proxy.log 2>&1 &
        for i in $(seq 1 30); do
          [ -S "/cloudsql/${INSTANCE}/.s.PGSQL.5432" ] && break
          sleep 1
        done
        if [ ! -S "/cloudsql/${INSTANCE}/.s.PGSQL.5432" ]; then
          echo "Proxy gagal siap dalam 30 detik:"; cat /tmp/cloud-sql-proxy.log; exit 1
        fi
        echo "Proxy siap: ${INSTANCE}"

    - name: Guard salah-target (secret tidak di-echo)
      shell: bash
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        INSTANCE: ${{ inputs.instance }}
        FORBID: ${{ inputs.forbid }}
      run: |
        if [[ "$DATABASE_URL" != *"host=/cloudsql/${INSTANCE}"* ]]; then
          echo "DITOLAK: DATABASE_URL tidak menunjuk ${INSTANCE}"; exit 1
        fi
        if [[ -n "$FORBID" && "$DATABASE_URL" == *"$FORBID"* ]]; then
          echo "DITOLAK: DATABASE_URL mengandung pola terlarang '${FORBID}'"; exit 1
        fi
        echo "Target OK: ${INSTANCE}"

    # Preflight 0039 — SEBELUM migrasi menyentuh database. Ketika 0039 ditolak
    # penjaganya sendiri, Prisma sudah menulis baris `_prisma_migrations` yang
    # belum selesai dan database itu terkunci P3009: setiap migrasi berikutnya
    # ditolak sampai seorang manusia menjalankan `migrate resolve`. Itu terjadi
    # pada solamax-pg-rlsstg 13 September 2026. Menolak di sini membuat
    # migrasinya tidak pernah MULAI — pada tier pilot biayanya jatuh di DB live.
    # Skrip ini read-only (REPEATABLE READ READ ONLY + ROLLBACK), melewati diri
    # sendiri bila 0039 sudah terpasang, dan men-scope `app.unit_ids` ke SELURUH
    # unit (scope sempit memulangkan nol tanpa galat — itu bukan "bersih").
    - name: Preflight snapshot quiescent (read-only)
      shell: bash
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: |
        command -v psql >/dev/null || {
          echo "DITOLAK: psql tidak ada di runner — preflight tidak dapat berjalan."
          echo "Pemeriksa yang tak bisa berjalan tidak boleh lulus diam-diam."
          exit 1
        }
        bash scripts/ci/check-snapshot-quiescent.sh

    # Gerbang cakupan unit — DUA SISI. Penjadwal snapshot per-unit, dan
    # cakupannya bergantung pada seseorang mengingat membuat job saat unit baru
    # di-onboard. Ingatan itu gagal DUA KALI pada 14-09-2026: sisi pemensiunan
    # (unit 4 menumpuk 30,3 juta baris) dan sisi BUILD (unit 4 punya 39 cycle
    # dengan complete = 0 selama dua hari, cut-nya lengkap, tak pernah dibangun).
    #
    # Daftar "unit yang mengirim cut" diambil dari DB — bukan dari registry —
    # karena unit yang agent-nya belum ditukar memang belum boleh dituntut punya
    # job. Gerbang yang memakai registry akan menyala tiap hari sampai unit
    # terakhir di-onboard, yaitu alarm yang selalu menyala.
    - name: Cakupan unit (build & pemensiunan)
      if: inputs.coverage != 'off'
      shell: bash
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
        MODE: ${{ inputs.coverage }}
      run: |
        # URL dikonversi oleh helper BERSAMA. Menulis ulang logikanya di sini
        # adalah cara versi kedua yang salah lahir — dan versi kedua itulah yang
        # menjatuhkan deploy pilot 15-09-2026.
        PSQL_URL="$(bash scripts/ci/psql-url.sh "$DATABASE_URL")"
        # Sentinel membuktikan kueri BENAR-BENAR berjalan. Tanpa itu, DB testing
        # yang kosong memulangkan baris kosong yang tak dapat dibedakan dari
        # sambungan yang gagal — dan "tidak ada keluaran" bukan sinyal.
        HASIL="$(psql "$PSQL_URL" -X -qAt -v ON_ERROR_STOP=1 -f scripts/ci/unit-bercut.sql)"
        SENTINEL="${HASIL%%|*}"
        UNIT_BERCUT="${HASIL#*|}"
        if [ "$SENTINEL" != "KUERI_JALAN" ]; then
          echo "DITOLAK: kueri unit-ber-cut tidak berjalan (sentinel='${SENTINEL}')." >&2
          echo "Ini kegagalan SAMBUNGAN/kueri, bukan 'tidak ada unit'." >&2
          exit 1
        fi
        echo "Sambungan & kueri OK. unit ber-cut: ${UNIT_BERCUT:-<kosong>}"

        JOBS="$(gcloud scheduler jobs list --location=asia-southeast2 --project=solamax --format='value(name.basename())')"
        BUILD_UNITS="$(printf '%s\n' "$JOBS" | grep -E '^solamax-snapshot-unit-[0-9]+$' | sed -E 's/.*-([0-9]+)$/\1/' | sort -n | paste -sd, - || true)"
        RETIRE_UNITS="$(printf '%s\n' "$JOBS" | grep -E '^solamax-snapshot-retire-unit-[0-9]+$' | sed -E 's/.*-([0-9]+)$/\1/' | sort -n | paste -sd, - || true)"
        RETIRE_ITERASI=false
        for JOB in $(printf '%s\n' "$JOBS" | grep -E 'retire' || true); do
          RAW="$(gcloud scheduler jobs describe "$JOB" --project=solamax --location=asia-southeast2 --format=json 2>/dev/null || echo '{}')"
          eval "$(printf '%s' "$RAW" | python3 scripts/ci/scheduler-job-facts.py)"
          if [ -z "$JOB_BODY_UNIT" ] && [ -n "$JOB_URI" ]; then RETIRE_ITERASI=true; fi
        done

        if UNIT_BERCUT="$UNIT_BERCUT" BUILD_UNITS="$BUILD_UNITS" RETIRE_UNITS="$RETIRE_UNITS" \
             RETIRE_ITERASI="$RETIRE_ITERASI" bash scripts/ci/check-snapshot-unit-coverage.sh; then
          exit 0
        fi
        if [ "$MODE" = "report" ]; then
          echo "::warning::Vonis cakupan MERAH, tetapi mode=report (tier testing)."
          echo "Sambungan dan kueri sudah terbukti jalan — itu bagian yang dijaga di sini."
          exit 0
        fi
        exit 1

    - name: prisma migrate deploy
      shell: bash
      env:
        DATABASE_URL: ${{ steps.db.outputs.url }}
      run: pnpm --filter @solamax/backend exec prisma migrate deploy
