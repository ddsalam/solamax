name: Deploy backend

# Model promosi dua-tier (lihat DEPLOY.md):
#   push → `staging`  ⇒ tier TESTING → migrasi DB TEST (solamax-pg-rlsstg)
#                        lalu deploy solamax-ingest-rlsstg   (otomatis, tanpa reviewer)
#   push → `main`     ⇒ tier PILOT   → gated Environment `pilot`, migrasi DB LIVE
#                        (solamax-pg) HARUS lulus penuh SEBELUM image baru
#                        menerima traffic, lalu deploy solamax-ingest-staging
# URUTAN INTI: build → migrate → deploy. Migrasi gagal = pipeline BERHENTI —
# revisi lama tetap melayani, tidak ada auto-rollback (halt-semantics).
# Migrasi dijalankan sebagai role `ingest` (pemilik DDL sejak RLS 0016) via
# Cloud SQL Auth Proxy di runner — cermin proses manual yang sudah terbukti
# (apps/backend/DEPLOY-GCP.md), kini terstruktur + guard salah-target.
# Deploy backend juga menegakkan timeout 20 menit dan binding Secret Manager
# untuk endpoint pemicu snapshot. Cloud SQL dan scaling service tetap terjaga.

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/backend/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "Dockerfile" # Dockerfile root = image backend
      - ".github/workflows/deploy-backend.yml"
      - ".github/actions/prisma-migrate/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # WIF token exchange

# Serialisasi per branch: dua migrate tidak pernah tumpang tindih di DB yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: asia-southeast2

jobs:
  # ── Gate kualitas (typecheck + seluruh test suite). ──
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solamax/shared build
      - run: pnpm --filter @solamax/backend prisma:generate
      - run: pnpm check

  # ── Build dulu: kalau image saja gagal dibangun, DB tidak pernah disentuh. ──
  build:
    needs: ci
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-southeast2-docker.pkg.dev/solamax/solamax/${{ github.ref == 'refs/heads/main' && 'solamax-ingest-staging' || 'solamax-ingest-rlsstg' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token
      - name: Build & push image (Dockerfile root)
        run: |
          echo '${{ steps.auth.outputs.access_token }}' \
            | docker login -u oauth2accesstoken --password-stdin https://asia-southeast2-docker.pkg.dev
          docker build -f Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ═══ TIER TESTING (staging → rlsstg) — otomatis, tanpa reviewer ═══

  # Migrasi HANYA DB test solamax-pg-rlsstg. Guard di composite action menolak
  # DATABASE_URL yang tidak menunjuk instance rlsstg — tier testing secara
  # struktural tidak bisa menyentuh DB live.
  migrate-test:
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @solamax/backend...
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: ./.github/actions/prisma-migrate
        with:
          instance: solamax:asia-southeast2:solamax-pg-rlsstg
          db-secret: solamax-db-url-ingest-rlsstg

  deploy-test:
    if: github.ref == 'refs/heads/staging'
    needs: [build, migrate-test]
    runs-on: ubuntu-latest
    environment: testing
    env:
      SERVICE: solamax-ingest-rlsstg
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy image + konfigurasi endpoint snapshot
        run: |
          # Label rls-aware diturunkan dari source backend (ingest.service.ts).
          RLS_AWARE=$(grep -q "set_config('app.unit_ids'" apps/backend/src/ingest/ingest.service.ts && echo 1 || echo 0)
          gcloud run deploy ${SERVICE} --region=${REGION} \
            --image '${{ needs.build.outputs.image }}' \
            --timeout=20m \
            --update-secrets=SNAPSHOT_TRIGGER_SECRET=solamax-warm-board-secret:latest \
            --update-labels rls-aware=${RLS_AWARE}
      # WAJIB mendahului health check: `curl $URL/health` menguji revisi yang SEDANG
      # menyajikan — yang bisa saja revisi LAMA — jadi tanpa guard ini ia hijau justru
      # karena revisi lama sehat.
      - uses: ./.github/actions/verify-serving-revision
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
      - name: Health check
        run: |
          URL=$(gcloud run services describe ${SERVICE} --region=${REGION} --format='value(status.url)')
          curl -fsS "$URL/health"
      # Job Cloud Scheduler yang memanggil endpoint snapshot diperiksa DI SINI,
      # karena dua kegagalannya sama-sama SENYAP:
      #   - header salah bentuk ditolak 404 di pintu, dan rejectWithoutOracle()
      #     membuatnya terlihat seperti unit tak dikenal. Build 02:05 WIB
      #     14-09-2026 hilang begitu, tanpa satu pun alarm.
      #   - job "sementara" yang menunjuk endpoint build memulangkan 425 ~20x
      #     sehari, sampai kegagalan sungguhan tak lagi terlihat di antaranya.
      # Keputusannya di scripts/ci/check-snapshot-scheduler-jobs.sh; self-test
      # delapan keadaannya berjalan di CI tanpa menyentuh GCP.
      #
      # Header dibaca lewat --format=json lalu diekstrak scheduler-job-facts.py,
      # yang hanya memancarkan uri, Content-Type, dan DAFTAR KUNCI. Jangan
      # pernah memakai --format yang menyebut httpTarget.headers utuh.
      - name: Job Scheduler snapshot harus benar bentuknya
        run: |
          ENDPOINT_ADA=false
          if grep -q '@Post("retire")' apps/backend/src/saldo-pelanggan/snapshot-trigger.controller.ts; then
            ENDPOINT_ADA=true
          fi
          ALL_UNITS_ADA=false
          if grep -q 'retireAllUnits' apps/backend/src/saldo-pelanggan/snapshot-worker.service.ts; then
            ALL_UNITS_ADA=true
          fi
          for JOB in solamax-snapshot-unit-1 solamax-snapshot-retire-unit-1; do
            case "$JOB" in *retire*) JOB_ROLE=retire ;; *) JOB_ROLE=build ;; esac
            RAW="$(gcloud scheduler jobs describe "$JOB" --project=solamax --location=${REGION} --format=json 2>/dev/null || echo '{}')"
            eval "$(printf '%s' "$RAW" | python3 scripts/ci/scheduler-job-facts.py)"
            JOB_NAME="$JOB" JOB_URI="$JOB_URI" JOB_CONTENT_TYPE="$JOB_CONTENT_TYPE" JOB_HEADER_KEYS="$JOB_HEADER_KEYS" JOB_BODY_UNIT="$JOB_BODY_UNIT" JOB_ROLE="$JOB_ROLE" ENDPOINT_ADA="$ENDPOINT_ADA" ALL_UNITS_ADA="$ALL_UNITS_ADA" bash scripts/ci/check-snapshot-scheduler-jobs.sh
          done

  # ═══ TIER PILOT (main → -staging = PILOT LIVE) — gated Environment `pilot` ═══

  # Gate approval ada DI SINI (job pertama yang berefek): klik approve Anda
  # mencakup migrasi DB live + deploy sesudahnya, dan terjadi SEBELUM DB disentuh.
  # forbid=rlsstg wajib: connection name pilot adalah prefix dari rlsstg.
  migrate-pilot:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pilot
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @solamax/backend...
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: ./.github/actions/prisma-migrate
        with:
          instance: solamax:asia-southeast2:solamax-pg
          db-secret: solamax-db-url-staging
          forbid: rlsstg

  deploy-pilot:
    if: github.ref == 'refs/heads/main'
    needs: [build, migrate-pilot]
    runs-on: ubuntu-latest
    env:
      SERVICE: solamax-ingest-staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy image + konfigurasi endpoint snapshot
        run: |
          RLS_AWARE=$(grep -q "set_config('app.unit_ids'" apps/backend/src/ingest/ingest.service.ts && echo 1 || echo 0)
          gcloud run deploy ${SERVICE} --region=${REGION} \
            --image '${{ needs.build.outputs.image }}' \
            --timeout=20m \
            --update-secrets=SNAPSHOT_TRIGGER_SECRET=solamax-warm-board-secret:latest \
            --update-labels rls-aware=${RLS_AWARE}
      # Insiden 2026-08-05→07 terjadi PERSIS di sini: traffic pilot ter-pin, deploy
      # membuat revisi baru tanpa memindahkan traffic, exit 0, job hijau, ~30 jam
      # menyajikan image lama. Guard ini yang menutupnya.
      - uses: ./.github/actions/verify-serving-revision
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
      - name: Health check
        run: |
          URL=$(gcloud run services describe ${SERVICE} --region=${REGION} --format='value(status.url)')
          curl -fsS "$URL/health"
