name: Deploy dashboard

# Model promosi dua-tier (lihat DEPLOY.md):
#   push → `staging`  ⇒ tier TESTING  → solamax-dashboard-rlsstg   (otomatis, tanpa reviewer)
#   push → `main`     ⇒ tier PILOT    → solamax-dashboard-staging  (gated Environment `pilot`)
# Jebakan nama (sengaja dipertahankan): service bersufiks -staging = PILOT LIVE;
# service bersufiks -rlsstg = tier testing. Deploy selalu IMAGE-ONLY —
# env/secrets/cloudsql/scaling service tidak disentuh. Auth via WIF, tanpa SA key.

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/dashboard/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # WIF token exchange

# Serialisasi per branch: merge beruntun antre (bukan saling batalkan) — deploy
# tidak pernah tumpang tindih di service yang sama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGION: asia-southeast2

jobs:
  # ── Gate kualitas: sama seperti CI + DS adherence lint. ──
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solamax/shared build
      - run: pnpm --filter @solamax/backend prisma:generate
      - run: pnpm check
      - run: pnpm --filter @solamax/dashboard lint:ds

  # ── Build sekali, nama image mengikuti tier. Push image = efek samping aman
  #    (image hanya "duduk" di Artifact Registry sampai job deploy memakainya). ──
  build:
    needs: ci
    runs-on: ubuntu-latest
    env:
      IMAGE: asia-southeast2-docker.pkg.dev/solamax/solamax/${{ github.ref == 'refs/heads/main' && 'solamax-dashboard-staging' || 'solamax-dashboard-rlsstg' }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
          token_format: access_token
      # Build in-runner dengan Docker (pelajaran terkunci: `gcloud builds submit`
      # 403 di bawah WIF), push langsung ke Artifact Registry.
      - name: Build & push image
        run: |
          echo '${{ steps.auth.outputs.access_token }}' \
            | docker login -u oauth2accesstoken --password-stdin https://asia-southeast2-docker.pkg.dev
          docker build -f apps/dashboard/Dockerfile -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  # ── GERBANG K1 (proposal G1, 2026-08-07): "SQL ini bisa DIEKSEKUSI" ──────────
  #
  #    KENAPA ADA: `count(*)::int FILTER (…)` — sintaks Postgres tidak valid —
  #    lolos typecheck (SQL cuma string), lolos 517 unit test (tak satu pun
  #    menyentuh DB), dan lolos job `ci` di atas HIJAU PENUH. Lalu 500 di
  #    produksi. Terbukti ulang 2026-08-07: dengan bug terpasang, `ci` hijau
  #    (0 error typecheck, 70 tes lolos) sementara gerbang ini MERAH pada tepat
  #    2 query yang membawanya.
  #
  #    SASARAN `solamax-pg-rlsstg` — BUKAN DB pilot. Karena itu "kalau DB pilot
  #    sedang sibuk" tak pernah jadi pertanyaan: pilot tidak disentuh. Unit
  #    sentinel 30000 tak ada → RLS 0 baris; yang diuji eksekusinya, bukan isinya.
  #
  #    ⛔ HANYA K1. Tes yang menuntut DATA tertentu (K2, `*-live.integration`)
  #       SENGAJA tidak di sini: ia bergantung angka yang diedit pengawas, jadi
  #       sebagai gerbang ia akan gagal karena sebab yang benar lalu dimatikan
  #       orang dalam sebulan. K2 tetap kanari.
  sqlcheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solamax/shared build
      - name: Cloud SQL Proxy → solamax-pg-rlsstg
        run: |
          curl -sSLo cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy solamax:asia-southeast2:solamax-pg-rlsstg --port 5432 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done
      # Kredensial dari SECRET MANAGER lewat WIF — BUKAN GitHub Actions secret.
      # Repo ini sengaja punya NOL repo-secret (`actions/secrets` = 0); semua
      # kredensial hidup di Secret Manager (CLAUDE.md aturan tak-bisa-dinegosiasi
      # №3). Memakai `${{ secrets.… }}` di sini akan mendarat KOSONG dan diam.
      - name: K1 — setiap query dieksekusi Postgres
        run: |
          SQLCHECK_RAW="$(gcloud secrets versions access latest \
            --secret=solamax-db-url-dashboard-rlsstg --project=solamax)"
          # Secret itu dipakai Cloud Run lewat SOCKET unix; di runner lewat TCP
          # proxy → buang param `host`, arahkan ke 127.0.0.1.
          DATABASE_URL="$(SQLCHECK_RAW="$SQLCHECK_RAW" node -e '
            const u = new URL(process.env.SQLCHECK_RAW.trim());
            u.searchParams.delete("host"); u.hostname="127.0.0.1"; u.port="5432";
            process.stdout.write(u.toString());')"
          export DATABASE_URL SQLCHECK_DB=1
          pnpm --filter @solamax/dashboard exec vitest run src/lib/queries.sqlcheck.integration.test.ts

  # ── TIER TESTING (staging → rlsstg): otomatis, tanpa reviewer. Environment
  #    `testing` dipakai untuk riwayat deployment + branch-policy (hanya staging). ──
  deploy-test:
    if: github.ref == 'refs/heads/staging'
    needs: [build, sqlcheck]
    runs-on: ubuntu-latest
    environment: testing
    env:
      SERVICE: solamax-dashboard-rlsstg
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy IMAGE-ONLY (env/secrets/cloudsql/scaling terjaga)
        run: |
          # Label rls-aware DITURUNKAN dari source (trust anchor preflight RLS) —
          # otomatis oleh CD, tidak pernah manual. Lihat apps/dashboard/src/lib/db.ts.
          RLS_AWARE=$(grep -q "set_config('app.unit_ids'" apps/dashboard/src/lib/db.ts && echo 1 || echo 0)
          gcloud run deploy ${SERVICE} --region=${REGION} \
            --image '${{ needs.build.outputs.image }}' \
            --update-labels rls-aware=${RLS_AWARE}
      # Menggantikan "Report serving revision" yang lama: langkah itu mencetak
      # status.latestReadyRevisionName — revisi yang SIAP, bukan yang MENYAJIKAN.
      # Pada service ber-traffic terpatok keduanya berbeda, dan yang dicetak justru
      # yang menenangkan. Guard ini membandingkan nama revisi dan bisa MERAH.
      - uses: ./.github/actions/verify-serving-revision
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
      - name: Report URL
        run: gcloud run services describe ${SERVICE} --region=${REGION} --format="value(status.url)"

  # ── TIER PILOT (main → -staging = PILOT LIVE): gated Environment `pilot`
  #    (required reviewer). Klik approve = satu-satunya jalan ke pilot. ──
  deploy-pilot:
    if: github.ref == 'refs/heads/main'
    needs: [build, sqlcheck]
    runs-on: ubuntu-latest
    environment: pilot
    env:
      SERVICE: solamax-dashboard-staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: solamax
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy IMAGE-ONLY (env/secrets/cloudsql/scaling terjaga)
        run: |
          RLS_AWARE=$(grep -q "set_config('app.unit_ids'" apps/dashboard/src/lib/db.ts && echo 1 || echo 0)
          gcloud run deploy ${SERVICE} --region=${REGION} \
            --image '${{ needs.build.outputs.image }}' \
            --update-labels rls-aware=${RLS_AWARE}
      # Menggantikan "Report serving revision" yang lama: langkah itu mencetak
      # status.latestReadyRevisionName — revisi yang SIAP, bukan yang MENYAJIKAN.
      # Pada service ber-traffic terpatok keduanya berbeda, dan yang dicetak justru
      # yang menenangkan. Guard ini membandingkan nama revisi dan bisa MERAH.
      - uses: ./.github/actions/verify-serving-revision
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
      - name: Report URL
        run: gcloud run services describe ${SERVICE} --region=${REGION} --format="value(status.url)"
