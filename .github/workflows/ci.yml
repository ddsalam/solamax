name: CI

# Gate tiap commit/PR. Termasuk uji akses-negatif multi-tenant (penegasan A):
# apps/dashboard/src/lib/scope.test.ts dijalankan oleh `pnpm -r test` → isolasi
# tenant/unit TAK BISA regresi senyap. Uji DB-live (scope.integration.test.ts)
# tetap gated SCOPE_LIVE_DB=1 (butuh Cloud SQL) — di-skip di CI.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guard tabrakan migrasi Prisma: nomor duplikat / out-of-order gagal di
      # sini (di PR: berjalan pada merge-preview) — SEBELUM CD sempat
      # menjalankan `migrate deploy`. Riwayat: tabrakan 0012/0013.
      - run: bash scripts/ci/check-migrations.sh
      # Penjaga workflow: berkas .github/workflows/ yang tak bisa di-parse
      # ditolak GitHub sebagai run TERPISAH yang TIDAK muncul di `gh pr checks`.
      # Dibayar 2026-08-09: gerbang G4 yang baru dipasang tak pernah berjalan
      # sementara semua check terlihat hijau. Di sini ia berbunyi di tempat yang
      # memang dilihat orang.
      - run: bash scripts/ci/check-workflows.sh
      # Self-test gerbang G4 — EMPAT keadaan termasuk JALUR HIJAU. Versi pertama
      # gerbang itu hanya pernah dibuktikan MERAH; jalur hijaunya mustahil karena
      # label pelepasnya belum dibuat. Setengah bukti, dan setengah yang hilang
      # justru yang menentukan gerbangnya dipakai atau ditinggalkan.
      - run: bash scripts/ci/check-arsip-g4.selftest.sh
      # Penjaga berkas cadangan ter-track. Sebabnya nyata: compliance.ts.bak —
      # sisa uji mutasi, yatim, salinan BASI logika vonis — sempat TAYANG di
      # `main`. Menjaga akhiran, bukan konsep; batasnya ditulis di skripnya.
      # Self-test gerbang job Scheduler snapshot — DELAPAN keadaan, termasuk
      # semua jalur hijau. Gerbang yang hanya pernah dibuktikan merah tak dapat
      # dibedakan dari gerbang yang rusak.
      - run: bash scripts/ci/check-snapshot-scheduler-jobs.selftest.sh
      - run: bash scripts/ci/check-backup-files.selftest.sh
      - run: bash scripts/ci/check-backup-files.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/shared harus ter-build sebelum typecheck paket hilir.
      - run: pnpm --filter @solamax/shared build
      # Prisma client harus ter-generate; tipe tx transaksi (backend) berasal darinya.
      - run: pnpm --filter @solamax/backend prisma:generate
      # typecheck semua paket + SELURUH test suite (incl. uji akses-negatif).
      # Self-test penjaga sintaks SQL — dibuktikan MERAH terhadap bug NYATA
      # (`///` di 0030) sebelum penjaganya dipercaya. `pnpm check` sendiri sudah
      # menjalankan checker-nya; ini yang membuktikan checker itu bisa gagal.
      - run: bash scripts/ci/check-sql-syntax.selftest.sh
      - run: pnpm check

  snapshot-postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: solamax_snapshot_ci
          POSTGRES_USER: snapshot_ci_admin
          # Disposable service credentials, never used by either deployment tier.
          POSTGRES_PASSWORD: snapshot_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snapshot_ci_admin -d solamax_snapshot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solamax/shared build
      - run: pnpm --filter @solamax/backend prisma:generate
      - run: pnpm --filter @solamax/backend exec vitest run src/saldo-pelanggan/snapshot-v2.postgres.test.ts
        env:
          SNAPSHOT_POSTGRES_CI: "1"
          SNAPSHOT_POSTGRES_CI_URL: postgresql://snapshot_ci_admin:snapshot_ci_only@127.0.0.1:5432/solamax_snapshot_ci

  # ── Gerbang "migrasinya dapat DI-DEPLOY" ────────────────────────────────────
  #
  # Job `snapshot-postgres-16` di atas membuktikan SQL migrasi 0039 benar. Pada
  # 13 September 2026 migrasi itu tetap gagal di DB test, dua kali, pada dua
  # guard berbeda — karena uji itu menyuntik SQL lewat psql per pernyataan,
  # sebagai peran pemilik, ke database yang uji itu sendiri baru siapkan. Job
  # ini menjalankan `prisma migrate deploy` yang SEBENARNYA (satu simple query
  # berisi seluruh berkas) sebagai peran NOSUPERUSER NOBYPASSRLS, terhadap
  # database yang SUDAH berisi keadaan sebelumnya. Rinciannya di skripnya.
  #
  # postgres:16 = paritas produksi; kedua tier Cloud SQL menjawab POSTGRES_16.
  # Sejak 2026-09-14 job snapshot di atas juga memakai 16, jadi seluruh gerbang
  # berbasis Postgres di repo ini berjalan pada satu versi mayor yang sama.
  migrate-deploy-postgres-16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: migrate_gate_admin
          # Kredensial layanan sekali pakai; tidak pernah dipakai tier mana pun.
          POSTGRES_PASSWORD: migrate_gate_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U migrate_gate_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @solamax/shared build
      - run: pnpm --filter @solamax/backend prisma:generate
      - run: bash scripts/ci/check-migrate-deploy.sh
        env:
          MIGRATE_DEPLOY_ADMIN_URL: postgresql://migrate_gate_admin:migrate_gate_only@127.0.0.1:5433/postgres
          MIGRATE_DEPLOY_HOST: 127.0.0.1
          MIGRATE_DEPLOY_PORT: "5433"
